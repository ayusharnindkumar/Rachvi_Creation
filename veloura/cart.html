<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Cart — Veloura Candles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<nav class="navbar scrolled" id="navbar" style="background:rgba(10,10,10,.97)">
  <div class="nav-container">
    <a href="index.html" class="nav-logo"><span class="logo-v">V</span>ELOURA</a>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
    </ul>
    <div class="nav-actions">
      <a href="cart.html" class="icon-btn">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span class="cart-badge" id="cartBadge">0</span>
      </a>
    </div>
  </div>
</nav>

<div class="cart-page">
  <p class="eyebrow">Your Selection</p>
  <h1>Shopping Cart</h1>

  <div class="cart-layout">
    <div id="cartItems"></div>

    <div class="cart-summary" id="cartSummary">
      <h3>Order Summary</h3>
      <div class="summary-row"><span>Subtotal</span><span id="subtotal">₹0</span></div>
      <div class="summary-row"><span>Shipping</span><span id="shipping">₹0</span></div>
      <div class="summary-row"><span style="font-size:.72rem;color:#aaa">Free shipping on orders ₹999+</span></div>
      <div class="summary-row total"><span>Total</span><span id="total">₹0</span></div>

      <button class="btn-gold" style="width:100%;justify-content:center;margin-top:1.5rem" onclick="checkout()">
        Proceed to Checkout
      </button>
      <a href="shop.html" class="btn-outline" style="width:100%;justify-content:center;margin-top:.8rem;display:flex">
        Continue Shopping
      </a>

      <div style="margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid #ddd">
        <p style="font-size:.7rem;letter-spacing:1px;color:#888;text-align:center;margin-bottom:.8rem">APPLY COUPON</p>
        <div style="display:flex;gap:.5rem">
          <input id="couponInput" type="text" placeholder="Enter code" style="flex:1;padding:.5rem .8rem;border:1px solid #ddd;font-family:'Montserrat',sans-serif;font-size:.78rem;outline:none"/>
          <button onclick="applyCoupon()" class="btn-outline" style="padding:.5rem 1rem;font-size:.7rem">Apply</button>
        </div>
      </div>

      <div style="margin-top:1.5rem;display:flex;justify-content:center;gap:1rem">
        <img src="https://img.icons8.com/color/48/visa.png" height="24" alt="Visa"/>
        <img src="https://img.icons8.com/color/48/mastercard.png" height="24" alt="Mastercard"/>
        <img src="https://img.icons8.com/color/48/upi.png" height="24" alt="UPI"/>
      </div>
      <p style="text-align:center;font-size:.65rem;color:#aaa;margin-top:.5rem">Secure Checkout • SSL Encrypted</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
<script>
function checkout(){
  if(!cart.length){ showToast('Your cart is empty'); return; }
  showToast('✦ Redirecting to checkout...');
  setTimeout(()=>{ alert('Checkout integration coming soon!\n\nOrder Total: '+document.getElementById('total').textContent); },1000);
}
function applyCoupon(){
  const code=document.getElementById('couponInput').value.toUpperCase();
  if(code==='VELOURA10') showToast('✦ 10% off applied!');
  else if(code==='LUXURY') showToast('✦ Free shipping applied!');
  else showToast('Invalid coupon code');
}
</script>
</body>
</html>
